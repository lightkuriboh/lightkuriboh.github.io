<body>
	<div class="container">
		<div class="div-container" id="hidden">
		 	<img class = "paper-for-text" src="img/paper0.png" alt="mem">
		 	<div class="text-block">
		    		<p class="memory" id="data_content">Sample text This is a sample text that you wont justify or notice that is is a sample text and you will see this line of text as sample text. Then you will find it out that this is not a sample text. It was created by the developer to test the auto-break new line. </p>
		  	</div>
			<span href="#" class="close" onclick="closePaper()"></span>
		</div>
		<div id="diamonds_place" class="diamonds"></div>
	</div>
	<script>
		let current_user = 'kuriboh'
		let memories = []
		let paperOpenned = false
		function start() {
			let diamonds = ''
			const n = memories.length
			for (let i = 0; i < n; i++) {
				let current_diamond = '<span id="random' + i.toString() + '" onclick="change_content(\'' + i.toString() + '\')"><img src="' + memories[i].img + '" style="width: 200px; height: 200px; position: absolute;"></span>'
				diamonds += current_diamond
			}
			document.getElementById('diamonds_place').innerHTML = diamonds
			for (let i = 0; i < n; i++) {
				let div_id = '#random' + i.toString()
				let time_interval = Math.min(Math.max(0.25, Math.random()), 0.6) * 1000
				let fade_interval = Math.min(Math.max(0.25, Math.random()), 0.6) * 1000
				let fadeout_interval = Math.min(Math.max(0.8, Math.random() * 1.5), 1.5) * 1000
				setInterval(function () {
					moveDiv(div_id, fade_interval, fadeout_interval)
				}, time_interval)
			}
		}
		function change_content(idx) {
			if (!paperOpenned) {
				document.getElementById('data_content').innerHTML = memories[idx].data
				openPaper()
			}
		}
		function moveDiv(id, interval, fadeout_interval) {
			var $span = $(id)

			$span.fadeOut(fadeout_interval, function() {
				var maxLeft = $(window).width() - $span.width()
				var maxTop = $(window).height() - $span.height()
				var leftPos = Math.floor(Math.random() * (maxLeft + 1))
				var topPos = Math.floor(Math.random() * (maxTop + 1))

				$span.css({ left: leftPos, top: topPos }).fadeIn(interval)
			})
		}
		function clear_all_intervals() {
			for (var i = 1; i <= memories.length; i++) {
				window.clearInterval(i)
			}
		}
		let current_text = ''
		let username = ''
		let password = ''
		$(document).on('keypress', function(e) {
			if (e.key.toString() === ' ') {
				password = current_text
				// login here
				current_user = current_text
				database.ref(current_user).once('value').then(function(snapshot) {
					let data = snapshot.val()
					if (data) {
						memories = data.data
						clear_all_intervals()
						start()	
					}
				})
				username = current_text
				current_text = ''
			} else {
				current_text += e.key.toString()
			}
		})
		function openPaper () {
			document.getElementById("hidden").style.display = "block"
			paperOpenned = true
		}
		function closePaper() {
			document.getElementById("hidden").style.display = "none"
			paperOpenned = false
		}
	</script>
</body>
