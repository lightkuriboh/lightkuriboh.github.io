<!DOCTYPE HTML>
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
	<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
	<link type="text/css" rel="stylesheet" href="css/index.css">
	<script type="text/javascript" src="js/index.js"></script>
	<script type = "text/javascript" src="js/ajax.js" > </script>
</head>
<body>
	<div class="modal fade" id="exampleModalLong" tabindex="-1" role="dialog" aria-labelledby="exampleModalLongTitle" aria-hidden="true">
		<div class="modal-dialog" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="exampleModalLongTitle">Modal title</h5>
					<button type="button" class="close" data-dismiss="modal" aria-label="Close">
				  		<span aria-hidden="true">&times;</span>
					</button>
			  	</div>
			  	<div class="modal-body" id="data_content">
			  	</div>
			  	<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-dismiss="modal">
						Close
					</button>
					<button type="button" class="btn btn-primary">
						Save changes
					</button>
			  	</div>
			</div>
		</div>
	</div>
	<div id="container">
		<img src onerror='start()'>
		<!--<span id="random" onclick="change_content('xxx')" data-toggle="modal" data-target="#exampleModalLong">-->
		<!--	<img src="img/diamond1.png" style="width: 300px; height: 300px;">-->
		<!--</span>-->
		<!--<span id="random2" onclick="change_content('yyy')" data-toggle="modal" data-target="#exampleModalLong">-->
		<!--	<img src="img/diamond2.png" style="width: 300px; height: 300px;">-->
		<!--</span> -->
		<div id="diamonds_place"></div>
	</div>
	<script>
		const memories = [
			{
				'data': 'memory1',
				'img': 'img/diamond1.png'
			},
			{
				'data': 'memory2',
				'img': 'img/diamond2.png'
			},
			{
				'data': 'memory3',
				'img': 'img/diamond3.png'
			},
			{
				'data': 'memory4',
				'img': 'img/diamond4.png'
			},
			{
				'data': 'memory5',
				'img': 'img/diamond5.png'
			},
			{
				'data': 'memory6',
				'img': 'img/diamond6.png'
			},
			{
				'data': 'memory7',
				'img': 'img/diamond7.png'
			},
			{
				'data': 'memory8',
				'img': 'img/diamond8.png'
			}
		]
		function start() {
			let diamonds = ''
			const n = memories.length
			for (let i = 0; i < n; i++) {
				let current_diamond = '<span id="random' + i.toString() + '" onclick="change_content(\'' + memories[i].data + '\')" data-toggle="modal" data-target="#exampleModalLong"><img src="' + memories[i].img + '" style="width: 200px; height: 200px;"></span>'
				diamonds += current_diamond
			}
			document.getElementById('diamonds_place').innerHTML = diamonds
			for (let i = 0; i < n; i++) {
				let div_id = '#random' + i.toString()
				let time_interval = Math.min(Math.max(0.25, Math.random()), 0.6) * 1000
				let fade_interval = Math.min(Math.max(0.25, Math.random()), 0.6) * 1000
				let fadeout_interval = Math.min(Math.max(0.8, Math.random() * 1.5), 1.5) * 1000
				setInterval(function () {
					moveDiv(div_id, fade_interval, fadeout_interval)
				}, time_interval)
			}
		}
		function change_content(value) {
			document.getElementById('data_content').innerHTML = value
		}
		function moveDiv(id, interval, fadeout_interval) {
			var $span = $(id)

			$span.fadeOut(fadeout_interval, function() {
				var maxLeft = $(window).width() - $span.width()
				var maxTop = $(window).height() - $span.height()
				var leftPos = Math.floor(Math.random() * (maxLeft + 1))
				var topPos = Math.floor(Math.random() * (maxTop + 1))

				$span.css({ left: leftPos, top: topPos }).fadeIn(interval)
			})
		}
	</script>
</body>
