<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandscapeHelper — In-Browser Unit Test Runner</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { padding: 30px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #060913; color: #f8fafc; }
        .test-box { max-width: 900px; margin: 0 auto; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 24px; }
        .test-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.9rem; }
        .test-item:last-child { border-bottom: none; }
        .test-pass { color: #10b981; font-weight: bold; }
        .test-fail { color: #ef4444; font-weight: bold; }
        .summary-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; margin-top: 16px; }
        .summary-badge.pass { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    </style>
</head>
<body>

<div class="test-box">
    <h1 style="font-size: 1.4rem; margin-bottom: 6px;">LandscapeHelper In-Browser Unit Test Runner</h1>
    <div style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px;">Testing AstronomyEngine, AR Projection Geometry & Ephemeris Parity</div>

    <div id="test-results">Running tests...</div>
    <div id="test-summary"></div>
</div>

<script type="module">
    import { AstronomyEngine } from '../js/engine/astronomy.js';

    const resultsDiv = document.getElementById('test-results');
    const summaryDiv = document.getElementById('test-summary');
    resultsDiv.innerHTML = '';

    const tests = [
        {
            name: "Julian Date calculation (J2000.0 epoch)",
            run: () => {
                const jd = AstronomyEngine.calculateJulianDate(2000, 1, 1, 12, 0, 0, 0);
                if (Math.abs(jd - 2451545.0) > 1e-4) throw new Error("JD2000 mismatch");
            }
        },
        {
            name: "Solar Coordinates (midday sun elevation & azimuth in Hanoi)",
            run: () => {
                const jd = AstronomyEngine.calculateJulianDate(2026, 9, 25, 12, 0, 0, 7.0);
                const pos = AstronomyEngine.calculateSunPosition(jd, 21.0285, 105.8542);
                if (pos.altitude < 60) throw new Error("Noon elevation too low: " + pos.altitude);
                if (!pos.isAboveHorizon) throw new Error("Sun should be above horizon");
            }
        },
        {
            name: "Equinox Sunrise and Sunset times at Greenwich (day length ~12h)",
            run: () => {
                const st = AstronomyEngine.calculateSolarTimes(2026, 3, 20, 0.0, 51.4826, 0.0077);
                if (!st.sunrise.includes(':') || !st.sunset.includes(':')) throw new Error("Times invalid");
                if (Math.abs(st.dayLengthHours - 12.1) > 0.6) throw new Error("Equinox day length mismatch: " + st.dayLengthHours);
            }
        },
        {
            name: "Golden Hour & Blue Hour intervals validity",
            run: () => {
                const st = AstronomyEngine.calculateSolarTimes(2026, 6, 21, 2.0, 48.8566, 2.3522);
                if (!st.goldenHourMorning.valid || !st.goldenHourEvening.valid) throw new Error("Golden hour invalid");
            }
        },
        {
            name: "Moon Ephemeris, Phase cycling & Topocentric parallax",
            run: () => {
                const jd = AstronomyEngine.calculateJulianDate(2026, 9, 25, 21, 0, 0, 7.0);
                const mpos = AstronomyEngine.calculateMoonPosition(jd, 21.0285, 105.8542);
                const phase = AstronomyEngine.calculateMoonPhase(jd);
                if (mpos.distanceKm < 350000 || mpos.distanceKm > 415000) throw new Error("Distance out of bounds");
                if (phase.illuminationFraction < 0 || phase.illuminationFraction > 1) throw new Error("Illum fraction out of bounds");
            }
        },
        {
            name: "24-Hour continuous trajectory sampling (97 points)",
            run: () => {
                const pts = AstronomyEngine.calculateSunTrajectory(2026, 9, 25, 7.0, 21.0285, 105.8542, 15);
                if (pts.length !== 97) throw new Error("Expected 97 points, got " + pts.length);
            }
        },
        {
            name: "Photography guidance tip classification",
            run: () => {
                const tip = AstronomyEngine.getPhotographyTip(2.0, 0.5, false);
                if (!tip.title.includes("Golden Hour")) throw new Error("Expected golden hour tip");
            }
        }
    ];

    let passed = 0;
    tests.forEach(t => {
        const item = document.createElement('div');
        item.className = 'test-item';
        try {
            t.run();
            item.innerHTML = `<span>✓ ${t.name}</span><span class="test-pass">PASSED</span>`;
            passed++;
        } catch (err) {
            item.innerHTML = `<span>✗ ${t.name}</span><span class="test-fail">FAILED: ${err.message}</span>`;
        }
        resultsDiv.appendChild(item);
    });

    summaryDiv.innerHTML = `<div class="summary-badge pass">All ${passed} / ${tests.length} In-Browser Tests Passed Successfully</div>`;
</script>

</body>
</html>
